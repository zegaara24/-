name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف Android
        run: |
          mkdir -p android-project
          unzip -o AlaBzikrApp-Android-with*.zip -d android-project

      - name: فحص الملفات
        run: |
          echo "=== الملفات الموجودة ==="
          find android-project -maxdepth 5 -type f | head -200

          echo "=== البحث عن gradlew ==="
          find android-project -type f -name gradlew -print

      - name: العثور على مشروع Android
        run: |
          GRADLEW=$(find android-project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "لم يتم العثور على gradlew"
            echo "محتويات المشروع:"
            find android-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaBzikrApp-debug
          path: android-project/**/build/outputs/apk/**/*.apk
