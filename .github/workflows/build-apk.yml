name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف Android ZIP
        shell: bash
        run: |
          echo "=== البحث عن ملف ZIP ==="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then:
            echo "لم يتم العثور على ملف ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi
          echo "تم العثور على:"
          echo "$ZIP_FILE"

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "=== محتويات Android ZIP ==="
          find android-project -maxdepth 5 -type f | head -300

       - name: البحث عن مشروع Android
        shell: bash
        run: |
          echo "=== البحث عن settings.gradle ==="

          PROJECT_DIR=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "*/.git/*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android داخل ZIP"
            find android-project -maxdepth 6 -type f | head -500
            exit 1
          fi

          echo "تم العثور على مشروع Android:"
          echo "$PROJECT_DIR"

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== ملفات المشروع ==="
          ls -la

          echo "=== إصدار Gradle ==="
          gradle --version

          echo "=== بناء APK ==="
          gradle assembleDebug --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaBzikrApp-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
