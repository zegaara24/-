name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: البحث عن مشروع Android
        shell: bash
        run: |
          echo "=== البحث عن مشروع Android ==="

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path "./.git/*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android."
            echo "محتويات المستودع:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "تم العثور على المشروع في:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بناء APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "لا يوجد ملف gradlew داخل مشروع Android."
            exit 1
          fi

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
