name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: البحث عن مشروع Android
        shell: bash
        run: |
          echo "=== البحث عن settings.gradle ==="

          PROJECT_DIR=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "./.git/*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android"
            find . -maxdepth 5 -type f | head -300
            exit 1
          fi

          echo "تم العثور على المشروع:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: بناء APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== ملفات المشروع ==="
          ls -la

          echo "=== بناء APK ==="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "لا يوجد gradlew داخل المشروع"
            echo "سيتم استخدام Gradle الموجود في GitHub Actions"

            gradle assembleDebug --stacktrace
          fi

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaBzikrApp-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
