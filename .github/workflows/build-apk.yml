name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف Android ZIP
        shell: bash
        run: |
          echo "=== البحث عن ملف ZIP ==="

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "تم العثور على:"
          echo "$ZIP_FILE"

          mkdir -p android-project
          unzip -o "$ZIP_FILE" -d android-project

          echo "=== محتويات المشروع ==="
          find android-project -maxdepth 4 -type f | head -200

      - name: البحث عن مشروع Android
        shell: bash
        run: |
          echo "=== البحث عن settings.gradle ==="

          PROJECT_DIR=$(find android-project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -not -path "*/.git/*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android داخل ZIP"
            echo "الملفات الموجودة:"
            find android-project -maxdepth 6 -type f | head -300
            exit 1
          fi

          echo "تم العثور على مشروع Android:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "=== بناء APK ==="

          if [ ! -f "./gradlew" ]; then
            echo "ملف gradlew غير موجود"
            ls -la
            exit 1
          fi

          chmod +x ./gradlew

          ./gradlew assembleDebug --stacktrace

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaBzikrApp-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
