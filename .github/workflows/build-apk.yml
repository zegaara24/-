name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ملف Android
        run: |
          mkdir -p android-project
          unzip -o AlaBzikrApp-Android-with*.zip -d android-project

      - name: تحديد مشروع Android
        run: |
          echo "=== ملفات المشروع ==="
          find android-project -maxdepth 4 -type f | head -200

      - name: بناء APK
        run: |
          cd android-project
          gradle assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: AlaBzikrApp-debug
          path: android-project/**/build/outputs/apk/**/*.apk
